services:
  sonaris-backend:
    container_name: sonaris-backend
    restart: always
    build:
      context: ./sonaris-backend
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=7071
      - Settings__MusicPath=/Musicas
    ports:
      - "${BACKEND_PORT:-5033}:7071"
    volumes:
      - "${MUSIC_PATH:-/home/luiz/Músicas}:/Musicas:rw"

  sonaris-frontend:
    container_name: sonaris-frontend
    restart: always
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    ports:
      - "${FRONTEND_PORT:-3003}:5173"
    depends_on:
      - sonaris-backend
