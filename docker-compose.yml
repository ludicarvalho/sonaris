services:
  sonaris-backend:
    container_name: sonaris-backend
    restart: always
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=7071
      - Settings__MusicPath=/Musicas
      - Settings__DatabasePath=/data/sonaris.db
      - Settings__JwtSecret=${JWT_SECRET:?defina JWT_SECRET no arquivo .env}
      - Settings__JwtIssuer=${JWT_ISSUER:-sonaris}
      - Settings__JwtAudience=${JWT_AUDIENCE:-sonaris}
      - Settings__JwtExpiraEmMinutos=${JWT_EXPIRA_EM_MINUTOS:-1440}
      - Settings__AdminUsername=${ADMIN_USERNAME:-admin}
      - Settings__AdminPassword=${ADMIN_PASSWORD:-admin}
      - Settings__AdminNome=${ADMIN_NOME:-Administrador}
    ports:
      - "${BACKEND_PORT:-5033}:7071"
    volumes:
      - "${MUSIC_PATH:-/home/luiz/Músicas}:/Musicas:rw"
      - "${SONARIS_DATA_DIR:-~/sonaris/database}:/data"

  sonaris-frontend:
    container_name: sonaris-frontend
    restart: always
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
    ports:
      - "${FRONTEND_PORT:-3003}:5173"
    depends_on:
      - sonaris-backend
